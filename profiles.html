<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پروفایل‌ها | خوش نمای</title>
    <link rel="icon" type="image/webp" href="logo.webp">
    <meta name="description"
        content="پروفایل‌های ساخته‌شده در خوش نمای؛ افراد و متخصصانی که نمای حرفه‌ای خود را در اینترنت ساخته‌اند.">

    <link rel="stylesheet" href="css/profiles.css">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container nav">

            <a href="./" class="brand">
                خوش نمای
            </a>

            <a href="./" class="back-link">
                صفحه اصلی
            </a>

        </div>
    </header>


    <main>

        <!-- Hero -->
        <section class="profiles-hero">

            <div class="container">

                <span class="badge">
                    پروفایل‌های خوش نمای
                </span>

                <h1>
                    آدم‌های پشت این
                    <span>صفحه‌ها.</span>
                </h1>

                <p>
                    با پروفایل‌های ساخته‌شده در خوش نمای
                    آشنا شوید.
                </p>

            </div>

        </section>


        <!-- Profiles -->
        <section class="profiles-section">

            <div class="container">

                <div class="section-heading">

                    <span>
                        کاربران خوش نمای
                    </span>

                    <h2>
                        پروفایل‌ها
                    </h2>

                </div>


                <div class="profiles-grid">

                    <!-- Profile 01 -->
                    <a href="profiles/parham/" class="profile-card">

                        <div class="profile-avatar">
                            <img src="profiles/parham/images/profile.webp" alt="پرهام دریکوند">
                        </div>

                        <div class="profile-info">

                            <h3>
                                پرهام دریکوند
                            </h3>

                            <p>
                                برنامه‌نویس و بازی‌ساز
                            </p>

                        </div>

                        <span class="profile-arrow">
                            ↗
                        </span>

                    </a>




                    <!-- Profile 02 -->
                    <a href="profiles/amirali_moradi/index.html" class="profile-card">

                        <div class="profile-avatar">
                            <img src="profiles/amirali_moradi/images/profile.webp" alt="عکس چهره امیرعلی مرادی">
                        </div>

                        <div class="profile-info">

                            <h3>
                                امیرعلی مرادی
                            </h3>

                            <p>
                                برنامه‌نویس وب
                            </p>

                        </div>

                        <span class="profile-arrow">
                            ↗
                        </span>

                    </a>


                </div>
                <!-- All Profiles -->
                <div class="all-profiles">

                    <a href="./profiles/index.html" class="all-profiles-button">
                        مشاهده همه پروفایل‌ها
                        <span>←</span>
                    </a>

                </div>

            </div>
        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            © 2026 خوش نمای — نمای حرفه‌ای شما در اینترنت.

        </div>

    </footer>

</body>

</html>
